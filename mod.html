<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mod Detayı | Kral Mods</title>

<style>
:root{
  --bg:#f6f9ff;
  --card:#ffffff;
  --text:#0b1a2b;
  --muted:#6b7280;
  --accent:#0b72d1;
  --accent2:#0aa2ff;
  --border:#e6eefc;
  --shadow:0 20px 50px rgba(11,114,209,.15);
  --radius:24px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:radial-gradient(1000px 400px at 20% -10%,rgba(10,162,255,.15),transparent 60%),var(--bg);
  color:var(--text);
}

.wrap{
  max-width:1000px;
  margin:0 auto;
  padding:40px 20px;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  animation:fade .5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

.image{
  width:100%;
  height:360px;
  background:#eaf2ff;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:30px;
}

.badge{
  display:inline-block;
  background:rgba(11,114,209,.1);
  color:var(--accent);
  padding:8px 16px;
  border-radius:999px;
  font-weight:700;
  font-size:12px;
  margin-bottom:16px;
}

h1{
  margin:0 0 10px;
  font-size:28px;
}

.meta{
  color:var(--muted);
  margin-bottom:20px;
}

.desc{
  line-height:1.7;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  padding:16px 28px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  text-decoration:none;
  font-weight:800;
  font-size:15px;
  box-shadow:0 15px 30px rgba(11,114,209,.25);
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 20px 40px rgba(11,114,209,.35);
}

.back{
  display:inline-block;
  margin-left:15px;
  padding:16px 24px;
  border-radius:18px;
  background:#fff;
  border:1px solid var(--border);
  color:var(--accent);
  text-decoration:none;
  font-weight:700;
}
</style>
</head>

<body>

<div class="wrap">
  <div id="modCard" class="card" style="display:none">
    <div class="image">
      <img id="modImage" src="">
    </div>

    <div class="content">
      <div id="modCategory" class="badge"></div>
      <h1 id="modName"></h1>
      <div id="modMeta" class="meta"></div>
      <div id="modDesc" class="desc"></div>

      <a id="modDownload" class="btn" target="_blank">🚜 İndir</a>
      <a href="index.html" class="back">← Geri Dön</a>
    </div>
  </div>

  <div id="notFound" style="text-align:center;margin-top:60px;color:var(--muted);display:none">
    Mod bulunamadı.
  </div>
</div>

<script>
function getParam(name){
  const url = new URL(window.location.href);
  return url.searchParams.get(name);
}

async function loadMod(){
  const id = getParam("id");
  if(!id){
    document.getElementById("notFound").style.display="block";
    return;
  }

  const res = await fetch("mods.json?cache="+Date.now());
  const mods = await res.json();

  const mod = mods.find(m=>m.id===id);

  if(!mod){
    document.getElementById("notFound").style.display="block";
    return;
  }

  document.getElementById("modCard").style.display="block";
  document.getElementById("modImage").src = mod.image || "KM-logo.png";
  document.getElementById("modCategory").textContent = mod.category;
  document.getElementById("modName").textContent = mod.name;
  document.getElementById("modDesc").textContent = mod.description;

  let meta="";
  if(mod.version) meta+="Sürüm: "+mod.version+" ";
  if(mod.author) meta+="• Yapımcı: "+mod.author+" ";
  if(mod.addedAt) meta+="• Eklenme: "+mod.addedAt;

  document.getElementById("modMeta").textContent=meta;
  document.getElementById("modDownload").href=mod.download;
}

loadMod();
</script>

</body>
</html>
