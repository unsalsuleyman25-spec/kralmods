<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin | Kral Mods</title>

<style>
body{
  font-family:system-ui;
  background:#f6f9ff;
  padding:30px;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.05);
  margin-bottom:20px;
}
input, textarea, select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
}
button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}
.primary{
  background:#0b72d1;
  color:white;
}
.danger{
  background:#e63946;
  color:white;
}
.hidden{
  display:none;
}
.mod-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="card" id="loginBox">
<h2>🔒 Admin Giriş</h2>
<input type="password" id="password" placeholder="Şifre">
<button class="primary" onclick="checkLogin()">Giriş Yap</button>
</div>

<div id="adminPanel" class="hidden">

<div class="card">
<h2>Yeni Mod Ekle</h2>

<input id="name" placeholder="Mod Adı">
<input id="id" placeholder="Mod ID (boşluksuz)">
<select id="category">
<option>Traktör</option>
<option>Harita</option>
<option>Ekipman</option>
<option>Skin</option>
<option>Yama</option>
<option>Diğer</option>
</select>
<textarea id="description" placeholder="Açıklama"></textarea>
<input id="download" placeholder="İndirme Linki">
<input id="image" placeholder="Resim URL (isteğe bağlı)">
<button class="primary" onclick="addMod()">Mod Ekle</button>
</div>

<div class="card">
<h2>Mevcut Modlar</h2>
<div id="modList"></div>
</div>

</div>

<script>

const ADMIN_PASSWORD = "kralmods2026";

function checkLogin(){
  const input = document.getElementById("password").value;
  if(input !== ADMIN_PASSWORD){
    alert("Yanlış şifre");
    return;
  }
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  loadMods();
}

const owner = "unsalsuleyman25-spec";
const repo = "kralmods";

function getToken(){
  return prompt("GitHub Token gir:");
}

async function getMods(token){
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/mods.json`,{
    headers:{Authorization:`Bearer ${token}`}
  });
  const data = await res.json();
  const content = atob(data.content);
  return {mods:JSON.parse(content), sha:data.sha};
}

async function updateMods(token,mods,sha,message){
  await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/mods.json`,{
    method:"PUT",
    headers:{
      Authorization:`Bearer ${token}`,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      message:message,
      content:btoa(JSON.stringify(mods,null,2)),
      sha:sha
    })
  });
}

async function addMod(){
  const token=getToken();
  if(!token)return;

  const {mods,sha}=await getMods(token);

  const newMod={
    id:document.getElementById("id").value,
    name:document.getElementById("name").value,
    category:document.getElementById("category").value,
    description:document.getElementById("description").value,
    download:document.getElementById("download").value,
    image:document.getElementById("image").value || "KM-logo.png",
    addedAt:new Date().toISOString().split("T")[0]
  };

  mods.unshift(newMod);

  await updateMods(token,mods,sha,"Add mod: "+newMod.id);

  alert("Mod eklendi!");
  location.reload();
}

async function deleteMod(id){
  const token=getToken();
  if(!token)return;

  const {mods,sha}=await getMods(token);

  const filtered=mods.filter(m=>m.id!==id);

  await updateMods(token,filtered,sha,"Delete mod: "+id);

  alert("Mod silindi!");
  location.reload();
}

async function loadMods(){
  const res=await fetch("mods.json?cache="+Date.now());
  const mods=await res.json();

  const list=document.getElementById("modList");
  list.innerHTML="";

  mods.forEach(mod=>{
    const div=document.createElement("div");
    div.className="mod-item";
    div.innerHTML=`
      <div>${mod.name} (${mod.id})</div>
      <button class="danger" onclick="deleteMod('${mod.id}')">Sil</button>
    `;
    list.appendChild(div);
  });
}

</script>

</body>
</html>
