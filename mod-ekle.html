<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mod Ekle | Kral Modları</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    h1 {
      color: royalblue;
      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    textarea {
      resize: none;
    }

    button {
      background: royalblue;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0056d2;
    }
  </style>
</head>
<body>

  <h1>🛠️ Yeni Mod Ekle</h1>

  <form id="modForm">
    <input type="text" id="modName" placeholder="Mod Adı" required />
    <input type="text" id="modCategory" placeholder="Kategori (örn: Traktör, Harita...)" required />
    <input type="text" id="modImage" placeholder="Resim URL'si" required />
    <textarea id="modDescription" placeholder="Açıklama (mod hakkında kısa bilgi)" rows="3" required></textarea>
    <input type="text" id="modDownload" placeholder="Download Linki" required />
    <button type="submit">Modu Ekle</button>
  </form>

  <script type="module">
    // Firebase modüler sürüm
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // 🔹 Firebase ayarların
    const firebaseConfig = {
      apiKey: "AIzaSyCuwqnkVf5GUoP-FBdBw6-VmVmZmlTDRcs",
      authDomain: "kralmods.firebaseapp.com",
      projectId: "kralmods",
      storageBucket: "kralmods.firebasestorage.app",
      messagingSenderId: "158656794483",
      appId: "1:158656794483:web:64efb0e566c7b0b8747f06"
    };

    // Firebase başlat
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form gönderme
    const form = document.getElementById("modForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("modName").value;
      const category = document.getElementById("modCategory").value;
      const image = document.getElementById("modImage").value;
      const description = document.getElementById("modDescription").value;
      const download = document.getElementById("modDownload").value;

      try {
        await addDoc(collection(db, "mods"), {
          name,
          category,
          image,
          description,
          download,
          created: serverTimestamp()
        });
        alert("✅ Mod başarıyla eklendi!");
        form.reset();
      } catch (err) {
        console.error("Hata:", err);
        alert("❌ Mod eklenemedi! Konsolu kontrol et.");
      }
    });
  </script>
</body>
</html>
