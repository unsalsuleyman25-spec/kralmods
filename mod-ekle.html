<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Ekle | Kral Mods</title>
</head>
<body style="font-family: Arial; background-color: #f3f6ff; padding: 20px;">

  <h2>Kral Mods - Yeni Mod Ekle</h2>

  <form id="modForm">
    <label>Mod Adı:</label><br>
    <input type="text" id="modAdi" required><br><br>

    <label>Kategori:</label><br>
    <input type="text" id="kategori" required><br><br>

    <label>Açıklama:</label><br>
    <textarea id="aciklama" required></textarea><br><br>

    <label>İndir Linki:</label><br>
    <input type="url" id="indirLink" required><br><br>

    <label>Resim Linki:</label><br>
    <input type="url" id="resimLink" required><br><br>

    <button type="submit">Modu Kaydet</button>
  </form>

  <p id="sonuc"></p>

  <script type="module">
    // Firebase SDK importları
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔹 Senin Firebase ayarların
    const firebaseConfig = {
      apiKey: "AIzaSyCuwqnkVf5GUoP-FBdBw6-VmVmZmlTDRcs",
      authDomain: "kralmods.firebaseapp.com",
      databaseURL: "https://kralmods-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kralmods",
      storageBucket: "kralmods.firebasestorage.app",
      messagingSenderId: "158656794483",
      appId: "1:158656794483:web:64efb0e566c7b0b8747f06"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Formu gönderme işlemi
    const form = document.getElementById("modForm");
    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const mod = {
        modAdi: document.getElementById("modAdi").value,
        kategori: document.getElementById("kategori").value,
        aciklama: document.getElementById("aciklama").value,
        indirLink: document.getElementById("indirLink").value,
        resimLink: document.getElementById("resimLink").value
      };

      const yeniModRef = push(ref(db, "modlar"));
      set(yeniModRef, mod)
        .then(() => {
          document.getElementById("sonuc").textContent = "✅ Mod başarıyla kaydedildi!";
          form.reset();
        })
        .catch((error) => {
          document.getElementById("sonuc").textContent = "❌ Hata: " + error.message;
        });
    });
  </script>

</body>
</html>
