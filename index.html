<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kral Mods — FS25 Mod İndir</title>

<style>
:root{
  --bg:#f6f9ff;
  --card:#ffffff;
  --text:#0b1a2b;
  --muted:#6b7280;
  --accent:#0b72d1;
  --accent2:#0aa2ff;
  --border:#e6eefc;
  --shadow: 0 10px 30px rgba(11,114,209,.12);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui;
  color:var(--text);
  background: radial-gradient(1200px 500px at 20% -10%, rgba(10,162,255,.18), transparent 55%), var(--bg);
}

.wrap{max-width:1100px; margin:0 auto; padding:24px;}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 18px;
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.brand h1{margin:0;font-size:18px}
.brand p{margin:0;font-size:12px;color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-top:20px;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(11,114,209,.2);
}

.thumb{
  height:160px;
  background:#eaf2ff;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:15px;
}

.title{margin:0 0 6px}

.badge{
  font-size:11px;
  color:var(--accent);
  font-weight:bold;
}

.desc{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions a{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
}

.secondary{
  background:#fff;
  border:1px solid var(--border);
  color:var(--accent);
}

.new-badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#0b72d1;
  color:white;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  box-shadow:0 8px 20px rgba(11,114,209,.3);
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="brand">
    <h1>Kral Mods 🚜</h1>
    <p>FS25 mod indir — temiz, hızlı</p>
  </div>
  <a href="admin.html">🔒 Admin</a>
</header>

<div id="grid" class="grid"></div>

</div>

<script>
async function loadMods(){
  const res = await fetch("mods.json?cache="+Date.now());
  const mods = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  mods.forEach((mod,index)=>{

    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      ${index===0 ? `<div class="new-badge">EN YENİ</div>` : ""}

      <div class="thumb">
        <img src="${mod.image || 'KM-logo.png'}">
      </div>

      <div class="content">
        <h3 class="title">${mod.name}</h3>
        <div class="badge">${mod.category}</div>
        <div class="desc">${mod.description}</div>

        <div class="actions">
          <a class="secondary" href="mod.html?id=${mod.id}">Detay</a>
          <a class="primary" href="${mod.download}" target="_blank">İndir</a>
        </div>
      </div>
    `;

    grid.appendChild(card);
  });
}

loadMods();
</script>

</body>
</html>
