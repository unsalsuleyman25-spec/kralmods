<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kral Mods | FS25 Modları</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    header {
      background: royalblue;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    .mod-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .mod-card {
      background: white;
      border-radius: 12px;
      width: 260px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .mod-card:hover {
      transform: scale(1.03);
    }

    .mod-card h3 {
      color: #222;
      margin-bottom: 10px;
    }

    .mod-card p {
      color: #555;
      margin: 0 0 10px;
    }

    .download-btn {
      display: inline-block;
      background: royalblue;
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .download-btn:hover {
      background: #0056d2;
    }

    footer {
      background: #222;
      color: #aaa;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚜 Kral Mods – FS25 Modları</h1>
    <p>En yeni traktör, araç ve harita modları burada!</p>
  </header>

  <main>
    <div class="mod-container" id="modList">
      <p>Modlar yükleniyor...</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Kral Mods | Tüm hakları saklıdır.</p>
  </footer>

  <script>
    // 🔹 Firebase ayarlarını buraya yapıştır (Firebase Console > Project Settings > Web App)
    const firebaseConfig = {
      apiKey: "API_KEY",
      authDomain: "PROJECT_ID.firebaseapp.com",
      projectId: "PROJECT_ID",
      storageBucket: "PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    // Firebase başlat
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Modları Firestore'dan çek ve listele
    const modList = document.getElementById("modList");

    db.collection("mods").orderBy("created", "desc").onSnapshot((snapshot) => {
      modList.innerHTML = ""; // Temizle
      snapshot.forEach((doc) => {
        const mod = doc.data();
        const card = `
          <div class="mod-card">
            <h3>${mod.name}</h3>
            <p><strong>Kategori:</strong> ${mod.category}</p>
            <a href="${mod.download}" target="_blank" class="download-btn">İndir</a>
          </div>
        `;
        modList.innerHTML += card;
      });

      if (snapshot.empty) {
        modList.innerHTML = "<p>Henüz mod eklenmemiş.</p>";
      }
    });
  </script>
</body>
</html>
