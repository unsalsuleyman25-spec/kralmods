<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kral Mods — FS25 Mod İndir</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#0b1a2b;
      --muted:#6b7280;
      --accent:#0b72d1;
    }
    body{
      background:var(--bg);
      color:var(--text);
      font-family:sans-serif;
      margin:0;
      padding:0;
    }
    header{
      background:var(--accent);
      color:white;
      padding:15px;
      text-align:center;
      font-size:1.5em;
      font-weight:bold;
    }
    #modList{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:16px;
      padding:20px;
      max-width:1100px;
      margin:auto;
    }
    .mod-card{
      background:white;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
      overflow:hidden;
      transition:transform 0.2s;
      cursor:pointer;
    }
    .mod-card:hover{
      transform:translateY(-4px);
    }
    .mod-card img{
      width:100%;
      height:180px;
      object-fit:cover;
    }
    .mod-card h3{
      margin:10px;
      color:var(--accent);
      font-size:1.1em;
    }
    .mod-card p{
      margin:0 10px 10px;
      color:var(--muted);
      font-size:0.9em;
    }
    .mod-card a{
      display:inline-block;
      margin:10px;
      background:var(--accent);
      color:white;
      padding:8px 14px;
      border-radius:6px;
      text-decoration:none;
      font-weight:bold;
    }
  </style>
</head>
<body>
  <header>Kral Mods 🚜</header>
  <div id="modList">Yükleniyor...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCuwqnkVf5GUoP-FBdBw6-VmVmZmlTDRcs",
      authDomain: "kralmods.firebaseapp.com",
      databaseURL: "https://kralmods-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kralmods",
      storageBucket: "kralmods.firebasestorage.app",
      messagingSenderId: "158656794483",
      appId: "1:158656794483:web:64efb0e566c7b0b8747f06"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById("modList");

    onValue(ref(db, "modlar"), (snapshot) => {
      if (!snapshot.exists()) {
        container.innerHTML = "<p>Henüz mod eklenmemiş.</p>";
        return;
      }

      container.innerHTML = "";
      snapshot.forEach(child => {
        const mod = child.val();
        container.innerHTML += `
          <div class="mod-card" onclick="location.href='mod.html?id=${mod.id}'">
            <img src="${mod.image}" alt="${mod.name}">
            <h3>${mod.name}</h3>
            <p>Kategori: ${mod.category || "Bilinmiyor"}</p>
            <a href="${mod.download}" target="_blank">📥 İndir</a>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
