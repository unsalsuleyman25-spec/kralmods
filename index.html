<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kral Mods | FS25 Modları</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 0;
      color: #0b1a2b;
    }

    header {
      background: #0b72d1;
      color: white;
      padding: 25px 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 15px;
      color: #e6e9ef;
    }

    .filter-buttons {
      text-align: center;
      margin-top: 15px;
    }

    .filter-buttons button {
      background: white;
      border: 1.8px solid #0b72d1;
      color: #0b72d1;
      padding: 8px 16px;
      border-radius: 8px;
      margin: 4px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
    }

    .filter-buttons button:hover,
    .filter-buttons button.active {
      background: #0b72d1;
      color: white;
    }

    .mod-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px 15px;
    }

    .mod-card {
      background: #ffffff;
      border-radius: 12px;
      width: 270px;
      padding: 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .mod-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .mod-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    h3 {
      margin: 5px 0;
      font-size: 18px;
      color: #0b1a2b;
    }

    p {
      font-size: 14px;
      color: #333;
      margin: 4px 0;
    }

    .download-btn {
      display: inline-block;
      background: #0b72d1;
      color: white;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 8px;
      transition: background 0.3s ease;
    }

    .download-btn:hover {
      background: #0056d2;
    }

    footer {
      background: #0b1a2b;
      color: #c8d2e0;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚜 Kral Mods – FS25 Modları</h1>
    <p>En yeni traktör, araç, yama ve skin modları burada!</p>
  </header>

  <div class="filter-buttons">
    <button class="active" onclick="filterMods('Tümü')">Tümü</button>
    <button onclick="filterMods('Araç')">Araç</button>
    <button onclick="filterMods('Yama')">Yama</button>
    <button onclick="filterMods('Skin')">Skin</button>
  </div>

  <main>
    <div class="mod-container" id="modList">
      <p>Modlar yükleniyor...</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Kral Mods | Tüm hakları saklıdır.</p>
  </footer>

  <script>
    const mods = [
      {
        name: "John Deere 8R",
        category: "Araç",
        description: "Güçlü ve modern bir traktör modu.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1200",
        download: "https://drive.google.com/uc?export=download&id=MOD_ID1"
      },
      {
        name: "Claas 8900",
        category: "Araç",
        description: "Yüksek verimli biçerdöver paketi.",
        image: "https://images.unsplash.com/photo-1602526218451-2f8f8b09bb68?w=1200",
        download: "https://drive.google.com/uc?export=download&id=MOD_ID2"
      },
      {
        name: "Gerçek Ses Paketi",
        category: "Yama",
        description: "Gerçek motor sesleri ekler.",
        image: "https://images.unsplash.com/photo-1581092335471-26b2d94f8a2c?w=1200",
        download: "https://drive.google.com/uc?export=download&id=MOD_ID3"
      },
      {
        name: "Mavi Kabin Skin",
        category: "Skin",
        description: "John Deere için özel mavi kabin kaplaması.",
        image: "https://images.unsplash.com/photo-1616628188469-4494ff28e61c?w=1200",
        download: "https://drive.google.com/uc?export=download&id=MOD_ID4"
      }
    ];

    const modList = document.getElementById("modList");
    const buttons = document.querySelectorAll(".filter-buttons button");

    function showMods(list) {
      modList.innerHTML = "";
      if (list.length === 0) {
        modList.innerHTML = "<p>Bu kategoride mod bulunmuyor.</p>";
        return;
      }
      list.forEach(mod => {
        const card = `
          <div class="mod-card">
            <img src="${mod.image}" alt="${mod.name}" class="mod-img">
            <h3>${mod.name}</h3>
            <p><strong>Kategori:</strong> ${mod.category}</p>
            <p>${mod.description}</p>
            <a href="${mod.download}" target="_blank" class="download-btn">İndir</a>
          </div>
        `;
        modList.innerHTML += card;
      });
    }

    function filterMods(category) {
      buttons.forEach(btn => btn.classList.remove("active"));
      document.querySelector(`button[onclick="filterMods('${category}')"]`).classList.add("active");
      if (category === "Tümü") {
        showMods(mods);
      } else {
        const filtered = mods.filter(mod => mod.category === category);
        showMods(filtered);
      }
    }

    showMods(mods);
  </script>

</body>
</html>
