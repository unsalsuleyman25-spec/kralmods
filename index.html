<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Kral Mods — FS25 Mod İndir</title>

<link rel="icon" type="image/png" href="KM-logo.png">

<style>
:root{
  --bg:#f6f9ff;
  --card:#ffffff;
  --text:#0b1a2b;
  --muted:#6b7280;
  --accent:#0b72d1;
  --accent2:#0aa2ff;
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}

.hero{
  text-align:center;
  padding:80px 20px 40px;
}

.hero h1{
  margin:0 0 10px;
}

.hero p{
  color:var(--muted);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:20px;
}

.search-box{
  text-align:center;
  margin-bottom:20px;
}

.search-box input{
  padding:12px;
  width:100%;
  max-width:400px;
  border-radius:12px;
  border:1px solid #ddd;
}

.filters{
  text-align:center;
  margin-bottom:25px;
}

.filters button{
  margin:4px;
  padding:8px 14px;
  border-radius:10px;
  border:1px solid #ddd;
  cursor:pointer;
  background:white;
}

/* 🟦 Aktif filtre */
.filters button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border-color:transparent;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.thumb{
  height:160px;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.content{
  padding:15px;
}

.title{
  margin:0 0 6px;
}

.badge{
  font-size:12px;
  color:var(--accent);
  font-weight:bold;
  margin-bottom:6px;
}

.desc{
  font-size:13px;
  color:var(--muted);
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions a{
  flex:1;
  text-align:center;
  padding:8px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
}

.secondary{
  border:1px solid #ddd;
  color:var(--accent);
}
</style>
</head>

<body>

<div class="hero">
  <h1>Kral Mods 🚜</h1>
  <p>FS25 için en kaliteli ve güncel modlar burada.</p>
</div>

<div class="wrap">

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Mod ara...">
  </div>

  <div class="filters">
    <button class="filter-btn" data-category="all">Hepsi</button>
    <button class="filter-btn" data-category="Traktör">Traktör</button>
    <button class="filter-btn" data-category="Harita">Harita</button>
    <button class="filter-btn" data-category="Ekipman">Ekipman</button>
    <button class="filter-btn" data-category="Skin">Skin</button>
    <button class="filter-btn" data-category="Yama">Yama</button>
  </div>

  <div id="grid" class="grid"></div>

</div>

<script>

let allMods = [];

async function loadMods(){
  const res = await fetch("mods.json?cache="+Date.now());
  const mods = await res.json();
  allMods = mods;
  renderMods(mods);
}

function renderMods(mods){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  mods.forEach(mod=>{
    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      <div class="thumb">
        <img src="${mod.image || 'KM-logo.png'}">
      </div>
      <div class="content">
        <h3 class="title">${mod.name}</h3>
        <div class="badge">${mod.category}</div>
        <div class="desc">${mod.description}</div>
        <div class="actions">
          <a class="secondary" href="mod.html?id=${mod.id}">Detay</a>
          <a class="primary" href="${mod.download}" target="_blank">İndir</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* 🔎 ARAMA */
document.getElementById("searchInput").addEventListener("keyup", function(){
  const value = this.value.toLowerCase();
  const filtered = allMods.filter(mod =>
    mod.name.toLowerCase().includes(value)
  );
  renderMods(filtered);
});

/* 🏷️ KATEGORİ */
document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click", function(){
    const category = this.getAttribute("data-category");

    if(category === "all"){
      renderMods(allMods);
    } else {
      const filtered = allMods.filter(mod =>
        mod.category === category
      );
      renderMods(filtered);
    }
  });
});

loadMods();

</script>

</body>
</html>
