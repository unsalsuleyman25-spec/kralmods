<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kral Mods | FS25 Modları</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    header {
      background: royalblue;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .mod-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .mod-card {
      background: white;
      border-radius: 12px;
      width: 270px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .mod-card:hover {
      transform: scale(1.03);
    }

    .mod-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    footer {
      background: #222;
      color: #aaa;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚜 Kral Mods – FS25 Modları</h1>
    <p>En yeni traktör, araç, yama ve harita modları burada!</p>
  </header>

  <main>
    <div class="mod-container" id="modList">
      <p>Modlar yükleniyor...</p>
    </div>
  </main>

  <footer>
    <p>© 2026 Kral Mods | Tüm hakları saklıdır.</p>
  </footer>

  <!-- Firebase Modüler -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCuwqnkVf5GUoP-FBdBw6-VmVmZmlTDRcs",
      authDomain: "kralmods.firebaseapp.com",
      projectId: "kralmods",
      storageBucket: "kralmods.appspot.com",
      messagingSenderId: "158656794483",
      appId: "1:158656794483:web:64efb0e566c7b0b8747f06"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const modList = document.getElementById("modList");

    async function loadMods() {
      try {
        const querySnapshot = await getDocs(collection(db, "mods"));
        modList.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const mod = doc.data();
          console.log("Mod bulundu:", mod); // kontrol için
          const card = `
            <div class="mod-card">
              <img src="${mod.image}" alt="${mod.name}" class="mod-img">
              <h3>${mod.name}</h3>
              <p><strong>Kategori:</strong> ${mod.category}</p>
              <p>${mod.description || "Açıklama bulunmuyor."}</p>
              <a href="${mod.download}" target="_blank">İndir</a>
            </div>
          `;
          modList.innerHTML += card;
        });

        if (querySnapshot.empty) {
          modList.innerHTML = "<p>Henüz mod eklenmemiş.</p>";
        }
      } catch (error) {
        console.error("Firestore'dan veri çekilemedi:", error);
        modList.innerHTML = "<p>Veri alınamadı. Konsolu kontrol et.</p>";
      }
    }

    loadMods();
  </script>
</body>
</html>
