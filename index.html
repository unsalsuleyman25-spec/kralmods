<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Kral Mods — FS25 Mod İndir | Güncel Farming Simulator 25 Modları</title>

<meta name="description" content="FS25 için en kaliteli ve güncel modları indir. Traktör, harita, ekipman ve daha fazlası Kral Mods'ta.">
<meta name="keywords" content="FS25 mod, Farming Simulator 25 mod, FS25 traktör mod, FS25 harita mod, Kral Mods">
<meta name="author" content="Kral Mods">

<meta property="og:title" content="Kral Mods — FS25 Mod İndir">
<meta property="og:description" content="FS25 için en kaliteli ve güncel modlar burada.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://unsalsuleyman25-spec.github.io/kralmods/">
<meta property="og:image" content="https://unsalsuleyman25-spec.github.io/kralmods/KM-logo.png">

<!-- ✅ FAVICON (KM-logo.png kullanıyor) -->
<link rel="icon" type="image/png" href="KM-logo.png">
<link rel="apple-touch-icon" href="KM-logo.png">

<style>
:root{
  --bg:#f6f9ff;
  --card:#ffffff;
  --text:#0b1a2b;
  --muted:#6b7280;
  --accent:#0b72d1;
  --accent2:#0aa2ff;
  --border:#e6eefc;
  --shadow:0 10px 30px rgba(11,114,209,.12);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui;
  color:var(--text);
  background:radial-gradient(1200px 600px at 50% -200px, rgba(10,162,255,.25), transparent 70%),var(--bg);
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px 60px;
}

.hero h1{
  font-size:42px;
  margin:0 0 15px;
}

.hero p{
  font-size:18px;
  color:var(--muted);
  margin-bottom:25px;
}

.hero a{
  display:inline-block;
  padding:14px 28px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 15px 35px rgba(11,114,209,.25);
  transition:.3s;
}

.hero a:hover{
  transform:translateY(-3px);
}

/* GRID */
.wrap{max-width:1100px;margin:0 auto;padding:0 24px 60px;}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}

/* CARD */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
  transition:transform .35s ease, box-shadow .35s ease;
}

.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 25px 55px rgba(11,114,209,.25);
}

.thumb{
  height:160px;
  background:#eaf2ff;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .4s ease;
}

.card:hover .thumb img{
  transform:scale(1.08);
}

.content{padding:15px}

.title{margin:0 0 6px}

.badge{
  font-size:11px;
  color:var(--accent);
  font-weight:bold;
}

.desc{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions a{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}

.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
}

.secondary{
  background:#fff;
  border:1px solid var(--border);
  color:var(--accent);
}

.new-badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#0b72d1;
  color:white;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  box-shadow:0 8px 20px rgba(11,114,209,.3);
}
</style>
</head>

<body>

<div class="hero">
  <h1>Kral Mods 🚜</h1>
  <p>FS25 için en kaliteli ve güncel modlar burada.</p>
  <a href="#mods">En Yeni Modları Keşfet</a>
</div>

<div id="mods" class="wrap">
  <!-- 🔎 Arama Kutusu -->
<div style="margin-bottom:20px;text-align:center;">
 
  >
<div id="mods" class="wrap">

  <!-- 🔎 Arama Kutusu -->
  <div style="margin-bottom:20px;text-align:center;">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Mod ara..."
      style="padding:12px 15px;width:100%;max-width:400px;border-radius:12px;border:1px solid #ddd;"
    >
  </div>

  <!-- 🏷️ Kategori Filtre -->
  <div style="text-align:center;margin-bottom:25px;">
    <button class="filter-btn" data-category="all">Hepsi</button>
    <button class="filter-btn" data-category="Traktör">Traktör</button>
    <button class="filter-btn" data-category="Harita">Harita</button>
    <button class="filter-btn" data-category="Ekipman">Ekipman</button>
    <button class="filter-btn" data-category="Skin">Skin</button>
    <button class="filter-btn" data-category="Yama">Yama</button>
  </div>

  <div id="grid" class="grid"></div>

</div>
<script>
async function loadMods(){
  const res = await fetch("mods.json?cache="+Date.now());
  const mods = await res.json();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  mods.forEach((mod,index)=>{
    const card = document.createElement("div");
    card.className="card";

    card.innerHTML = `
      ${index===0 ? `<div class="new-badge">EN YENİ</div>` : ""}

      <div class="thumb">
        <img src="${mod.image || 'KM-logo.png'}">
      </div>

      <div class="content">
        <h3 class="title">${mod.name}</h3>
        <div class="badge">${mod.category}</div>
        <div class="desc">${mod.description}</div>

        <div class="actions">
          <a class="secondary" href="mod.html?id=${mod.id}">Detay</a>
          <a class="primary" href="${mod.download}" target="_blank">İndir</a>
        </div>
      </div>
    `;

    grid.appendChild(card);
  });
}

loadMods();
// 🔎 CANLI ARAMA (DAHA SAĞLAM)
const searchInput = document.getElementById("searchInput");

if(searchInput){
  searchInput.addEventListener("keyup", function() {
    const value = this.value.toLowerCase();
    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
      const title = card.querySelector(".title");
      if(!title) return;

      if(title.textContent.toLowerCase().includes(value)){
        card.style.display = "";
      } else {
        card.style.display = "none";
      }
    });
  });
}
  // 🏷️ KATEGORİ FİLTRE
document.querySelectorAll(".filter-btn").forEach(button=>{
  button.addEventListener("click", function(){
    const category = this.getAttribute("data-category");
    const cards = document.querySelectorAll(".card");

    cards.forEach(card=>{
      const badge = card.querySelector(".badge");
      if(!badge) return;

      if(category === "all"){
        card.style.display = "";
      } else if(badge.textContent === category){
        card.style.display = "";
      } else {
        card.style.display = "none";
      }
    });
  });
});
 <div id="mods" class="wrap">

  <!-- 🔎 Arama Kutusu -->
  ...search input...

  <!-- 🏷️ Kategori Filtre -->
  <div style="text-align:center;margin-bottom:25px;">
    <button class="filter-btn" data-category="all">Hepsi</button>
    <button class="filter-btn" data-category="Traktör">Traktör</button>
    <button class="filter-btn" data-category="Harita">Harita</button>
    <button class="filter-btn" data-category="Ekipman">Ekipman</button>
    <button class="filter-btn" data-category="Skin">Skin</button>
    <button class="filter-btn" data-category="Yama">Yama</button>
  </div>

  <div id="grid" class="grid"></div>

</div>
</script>
</body>
</html>
